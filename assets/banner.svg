<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Janira Sánchez Latorre — Data Analyst">
  <defs>
    <linearGradient id="acento" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="rejilla" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
    <style>
      .t { font-family: 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
      .kicker { font-size: 15px; font-weight: 600; letter-spacing: 4px; fill: #94A3B8; }
      .name { font-size: 50px; font-weight: 700; fill: #F8FAFC; }
      .role { font-size: 20px; font-weight: 400; fill: #CBD5E1; }
    </style>
  </defs>
  <rect width="1200" height="240" rx="18" fill="#0F172A"/>
  <rect width="1200" height="240" rx="18" fill="url(#rejilla)" opacity=".6"/>
  <!-- gráfico decorativo: línea de tendencia -->
  <polyline points="820,180 880,150 940,162 1000,118 1060,128 1120,76" fill="none" stroke="url(#acento)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
  <g fill="#22D3EE">
    <circle cx="1000" cy="118" r="4"/><circle cx="1120" cy="76" r="5"/>
  </g>
  <text class="t kicker" x="70" y="78">DATA ANALYST · BI · PEOPLE ANALYTICS</text>
  <text class="t name" x="70" y="138">Janira Sánchez Latorre</text>
  <rect x="70" y="156" width="96" height="4" rx="2" fill="url(#acento)"/>
  <text class="t role" x="70" y="196">Python · SQL · Power BI · Automatización de datos</text>
</svg>
